:root{
  --bosque:#1F4D3A; --hoja:#4E8B3F; --brote:#8DBF6A; --salvia:#E6EFE1; --crema:#FAF7F0;
  --citrus:#E8A33D; --tierra:#8A6A4B; --texto:#1E2A24; --gris:#66756D; --linea:#D9E0DA;
  --alerta:#C0392B; --aviso:#D98E04; --ok:#2E7D4F; --info:#2F6F9F; --blanco:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Open Sans",sans-serif;color:var(--texto);font-size:14px;padding:30px}
h1,h2,h3,h4,.mont{font-family:Montserrat,sans-serif}
.screen{background:var(--blanco);margin-bottom:40px;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.desk{width:1280px}
/* browser chrome */
.chrome{background:#ECEEED;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d5d8d6}
.dots span{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.dots span:nth-child(1){background:#ef6a5e}.dots span:nth-child(2){background:#f5bf4f}.dots span:nth-child(3){background:#61c454}
.url{flex:1;background:#fff;border-radius:16px;padding:6px 14px;font-size:12.5px;color:#444;display:flex;align-items:center;gap:8px}
.lock{color:var(--ok);font-weight:700}
/* site header */
.topbar{background:var(--bosque);color:#E6EFE1;font-size:12px;padding:6px 40px;display:flex;justify-content:space-between}
.hdr{display:flex;align-items:center;gap:26px;padding:14px 40px;border-bottom:1px solid var(--linea)}
.logo{display:flex;align-items:center;gap:9px;font-family:Montserrat;font-weight:700;color:var(--bosque);font-size:19px;white-space:nowrap}
.logo small{display:block;font-size:9.5px;font-weight:600;letter-spacing:1.6px;color:var(--hoja)}
.leaf{width:34px;height:34px;border-radius:0 50% 0 50%;background:linear-gradient(135deg,var(--brote),var(--hoja));position:relative}
.leaf:after{content:"";position:absolute;left:6px;top:16px;width:22px;height:2px;background:#fff;transform:rotate(-45deg);opacity:.8}
.nav{display:flex;gap:22px;font-family:Montserrat;font-weight:600;font-size:13.5px;color:var(--texto)}
.nav .on{color:var(--hoja);border-bottom:2px solid var(--hoja);padding-bottom:3px}
.search{flex:1;max-width:260px;border:1px solid var(--linea);border-radius:20px;padding:8px 14px;color:var(--gris);font-size:13px}
.icons{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--texto)}
.cart{position:relative;font-weight:600}
.cart b{position:absolute;top:-9px;right:-12px;background:var(--citrus);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
.btn{display:inline-block;font-family:Montserrat;font-weight:600;font-size:13.5px;padding:11px 22px;border-radius:24px;border:2px solid transparent;white-space:nowrap}
.btn-p{background:var(--hoja);color:#fff}
.btn-d{background:var(--bosque);color:#fff}
.btn-c{background:var(--citrus);color:#fff}
.btn-o{border-color:var(--hoja);color:var(--hoja);background:#fff}
.btn-g{background:#EEF1EF;color:var(--texto)}
.btn-sm{padding:6px 14px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--salvia);color:var(--bosque)}
.badge.c{background:#FCEBD0;color:#8A5600}
.badge.r{background:#F8DEDA;color:var(--alerta)}
.badge.b{background:#DCEAF5;color:var(--info)}
.badge.g{background:#ECEFED;color:var(--gris)}
.line-tag{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--hoja)}
.price{font-family:Montserrat;font-weight:700;font-size:18px;color:var(--bosque)}
.card{border:1px solid var(--linea);border-radius:12px;background:#fff}
.ph{background:var(--crema);display:flex;align-items:center;justify-content:center;border-radius:10px;position:relative}
.ph .cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--gris)}
.annot{position:absolute;background:#7B2CBF;color:#fff;font-weight:700;font-family:Montserrat;font-size:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;z-index:5}
.rel{position:relative}
input,.inp{display:block;width:100%;border:1px solid #C9D2CC;border-radius:8px;padding:9px 11px;font-size:13px;color:var(--texto);background:#fff;font-family:"Open Sans"}
.inp.ph-t{color:#98A39C}
.inp.err{border-color:var(--alerta);background:#FFF7F6}
label,.lbl{display:block;font-size:12px;font-weight:600;margin:0 0 5px;color:var(--texto)}
.req{color:var(--alerta)}
.help{font-size:11px;color:var(--gris);margin-top:4px}
.errtxt{font-size:11px;color:var(--alerta);margin-top:4px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:6px 0}
.box{width:16px;height:16px;border:1.6px solid #9AA8A0;border-radius:4px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.box.on{background:var(--hoja);border-color:var(--hoja)}
.radio{width:16px;height:16px;border:1.6px solid #9AA8A0;border-radius:50%;flex:none;margin-top:1px}
.radio.on{border:5px solid var(--hoja)}
.grid{display:grid;gap:14px}
.muted{color:var(--gris)}
.foot{background:var(--bosque);color:#cfe0d3;padding:22px 40px;font-size:12px;display:flex;justify-content:space-between}
/* admin */
.adm{display:flex;min-height:760px}
.side{width:220px;background:var(--bosque);color:#d5e4d9;padding:18px 0;flex:none}
.side .logo{color:#fff;padding:0 18px 18px;font-size:16px}
.side .logo small{color:var(--brote)}
.side a{display:flex;gap:10px;align-items:center;padding:10px 20px;font-size:13px;font-weight:600}
.side a.on{background:rgba(255,255,255,.12);color:#fff;border-left:4px solid var(--brote);padding-left:16px}
.side .sec{font-size:10px;letter-spacing:1.4px;color:#8fb39b;padding:14px 20px 6px}
.ico{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.25);flex:none}
.main{flex:1;background:#F4F6F4;padding:22px 26px}
.atop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.atop h2{font-size:21px;color:var(--bosque)}
.kpi{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--linea)}
.kpi .v{font-family:Montserrat;font-weight:700;font-size:24px;color:var(--bosque);margin:4px 0}
.kpi .t{font-size:12px;color:var(--gris);font-weight:600}
.up{color:var(--ok);font-size:11.5px;font-weight:700}
.down{color:var(--alerta);font-size:11.5px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;letter-spacing:.4px;color:var(--gris);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--linea);background:#FAFBFA;text-transform:uppercase}
td{padding:10px;border-bottom:1px solid #EDF0EE}
.user{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--brote);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
/* devices */
.phone{width:380px;height:720px;border:12px solid #1d1f1e;border-radius:40px;overflow:hidden;background:#fff;position:relative}
.tablet{width:820px;border:14px solid #1d1f1e;border-radius:28px;overflow:hidden;background:#fff}
.notch{height:26px;background:#fff;display:flex;justify-content:space-between;padding:6px 22px;font-size:11px;font-weight:700}

body{padding:0;background:#fff}
.proto-banner{background:#7B2CBF;color:#fff;font-size:12px;text-align:center;padding:5px 10px;font-family:"Open Sans"}
.wrap{max-width:1280px;margin:0 auto}
a{color:inherit;text-decoration:none;cursor:pointer}
.nav span,.click{cursor:pointer}
.hdr{flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px}.search input{border:none;outline:none;font:inherit;width:100%;padding:0;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.layout{display:flex;gap:26px;padding:16px 40px 34px}
.filters{width:230px;flex:none}
.chk{cursor:pointer;user-select:none}
.chip{cursor:pointer;user-select:none}
.mobile-only{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bosque);color:#fff;padding:12px 20px;border-radius:24px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:50}
.prodgrid{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;padding:20px 40px 36px}
.adm{min-height:640px}
.aside{width:230px;background:#1E2A24;color:#cfd8d3;padding:16px 0;flex:none}
.aside a{display:flex;gap:10px;padding:9px 18px;font-size:13px;font-weight:600}
.aside a.sub{padding-left:44px;font-weight:400;font-size:12.5px}
.aside a.on{background:rgba(255,255,255,.12);color:#fff}
.amain{flex:1;background:#F3F4F3;padding:22px 26px}
.top2{background:#1E2A24;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:10px}
.tag.a{background:#D6F0DC;color:#1E6B34}.tag.b{background:#E6E8E7;color:#55605A}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--linea)}
.tabs span{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--gris);cursor:pointer}
.tabs span.on{background:#E6E8E7;color:var(--texto)}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--crema);display:flex;align-items:center;justify-content:center}
input.inp{font-family:"Open Sans"}
select.inp{font-family:"Open Sans";appearance:auto}
.sw{display:inline-block;width:34px;height:20px;border-radius:10px;background:var(--hoja);position:relative;cursor:pointer}
.sw i{position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw.off{background:#C9D2CC}.sw.off i{right:auto;left:3px}
tr.rowlink{cursor:pointer}tr.rowlink:hover td{background:#F7FAF7}
@media(max-width:767px){
 .topbar{display:none}.nav{display:none}.hdr{padding:10px 16px;gap:10px}.hdr .search{max-width:none;flex-basis:100%;order:3}
 .layout{padding:10px 16px 24px}.filters{display:none}.filters.open{display:block;position:fixed;inset:0;background:#fff;z-index:40;padding:16px;overflow:auto;width:auto}
 .cards{grid-template-columns:1fr 1fr;gap:10px}.mobile-only{display:inline-block}
 .prodgrid{grid-template-columns:1fr;padding:12px 16px;gap:16px}.hero{grid-template-columns:1fr!important;padding:24px 16px!important}.hero h1{font-size:26px!important}
 .lines{grid-template-columns:1fr!important}.foot{flex-direction:column;gap:8px;padding:18px 16px}.pad{padding:16px!important}
 .card .price{font-size:15px}
}

 {id:"detergente-citrus",name:"Detergente líquido concentrado Citrus",line:"Bioproductos DK",type:"Detergentes",aroma:"Citrus",color:"#E8A33D",k:"",cert:["Biodegradable","Libre de testeo animal","Hipoalergénico","Antibacterial"],perf:"40 lavados por litro · dosis 25 ml",status:"Activo",desc:"Detergente concentrado formulado a partir de ingredientes valorizados de residuos orgánicos. Apto para lavado a mano y máquina.",v:[{size:"1 L",sku:"BDK-DET-CIT-1L",price:6990,stock:84},{size:"5 L",sku:"BDK-DET-CIT-5L",price:27990,stock:8}]},
 {id:"detergente-eucaliptus",name:"Detergente líquido Eucaliptus",line:"Bioproductos DK",type:"Detergentes",aroma:"Eucaliptus",color:"#4E8B3F",k:"",cert:["Biodegradable","Libre de testeo animal"],perf:"40 lavados por litro · dosis 25 ml",status:"Activo",desc:"Detergente líquido biodegradable con aroma a eucaliptus para ropa blanca y de color.",v:[{size:"1 L",sku:"BDK-DET-EUC-1L",price:6990,stock:61}]},
 {id:"detergente-ahorro",name:"Detergente Eucaliptus formato ahorro",line:"Bioproductos DK",type:"Detergentes",aroma:"Eucaliptus",color:"#2E6B4F",k:"",cert:["Biodegradable","Libre de testeo animal"],perf:"40 lavados por litro",status:"Activo",desc:"Formato de 5 litros para hogares e instituciones.",v:[{size:"5 L",sku:"BDK-DET-EUC-5L",price:27990,stock:3}]},
 {id:"champu-romero",name:"Champú sólido Romero",line:"Bio-Renua",type:"Champús sólidos",aroma:"Romero",color:"#8A6A4B",k:"bar",cert:["Biodegradable","Libre de testeo animal"],perf:"",status:"Activo",desc:"Champú sólido con extracto de romero, sin envase plástico.",v:[{size:"70 g",sku:"BRN-CHA-ROM-70",price:7490,stock:40}]},

 {id:"limpiador-bioclar",name:"Limpiador multiuso (prototipo)",line:"Bioclar",type:"Limpiadores",aroma:"Neutro",color:"#2F6F9F",k:"",cert:["Biodegradable"],perf:"",status:"Borrador",desc:"Nueva línea en desarrollo.",v:[{size:"500 ml",sku:"BCL-LIM-500",price:4990,stock:0}]}
];
const FILTERS_DEF=[["avail","Disponibilidad"],["price","Precio"],["line","Línea de marca"],["type","Categoría"],["size","Tamaño / volumen"],["aroma","Aroma"],["cert","Certificación"]];
let FVIS={avail:1,price:1,line:1,type:1,size:1,aroma:1,cert:1};
let F={line:[],type:[],size:[],aroma:[],cert:[],avail:false,min:"",max:"",q:"",sort:"vend"};
let ADMIN=false, TAB="Todos";
const $=s=>document.querySelector(s);
const clp=n=>"$"+n.toLocaleString("es-CL");
const pub=()=>DB.filter(p=>p.status==="Activo");
const total=p=>p.v.reduce((a,b)=>a+b.stock,0);
function bottle(c,k,big){if(k==='bar')return `<svg width="${big?160:'60%'}" height="${big?160:'60%'}" viewBox="0 0 60 60"><rect x="8" y="18" width="44" height="28" rx="12" fill="${c}"/><rect x="14" y="26" width="32" height="10" rx="4" fill="#fff" opacity=".7"/></svg>`;return `<svg height="${big?300:'78%'}" viewBox="0 0 40 70"><rect x="15" y="2" width="10" height="8" rx="2" fill="#2b3a33"/><path d="M12 12h16l4 8v44a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V20z" fill="${c}"/><rect x="11" y="30" width="18" height="20" rx="2" fill="#fff" opacity=".85"/><path d="M16 42c4-8 8-8 8-8s-1 8-8 8z" fill="#4E8B3F"/></svg>`}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function go(h){location.hash=h}
function header(on){
 const items=[["Inicio","#/inicio"],["Catálogo","#/catalogo"],["Bioproductos DK","#/catalogo?line=Bioproductos DK"],["Bio-Renua","#/catalogo?line=Bio-Renua"],["Bioclar","#/catalogo?line=Bioclar"],["Contacto","#/contacto"]];
 return `<div class="topbar"><span>Catálogo de productos biodegradables · Bioproductos DK</span><span>💬 Consultas: WhatsApp +56 9 7977 1179 · <a href="#/admin" style="text-decoration:underline">Administración</a></span></div>
 <div class="hdr"><a class="logo" href="#/inicio"><div class="leaf"></div><div>Bioproductos DK<small>BIOTECNOLOGÍA SUSTENTABLE</small></div></a>
 <div class="nav">${items.map(i=>`<a href="${i[1]}" class="${i[0]==on?'on':''}">${i[0]}</a>`).join('')}</div>
 <div class="search">🔍 <input id="q" placeholder="Buscar productos…" value="${F.q}" style="width:85%"></div></div>`;
}
function footer(){return `<div class="foot"><div><b style="color:#fff">Bioproductos DK SpA</b><br>Huérfanos 1160, Of. 1102, Santiago</div><div>Prototipo PMV · catálogo en Shopify (Sprint 1)</div></div>`}
function bindSearch(){const q=$('#q');if(!q)return;q.addEventListener('keydown',e=>{if(e.key==='Enter'){F.q=q.value.trim();go('#/catalogo?q='+encodeURIComponent(F.q))}})}
function card(p){const st=total(p);const low=st>0&&st<=5;const lab=st===0?'Agotado':low?`Últimas ${st} unidades`:'';const minp=Math.min(...p.v.map(v=>v.price));
 return `<a class="card" href="#/producto/${p.id}" data-id="${p.id}" style="padding:12px;display:block;${st===0?'opacity:.75':''}"><div class="ph prod" style="height:170px;position:relative">${bottle(p.color,p.k)}${lab?`<span class="badge ${st===0?'g':'r'}" style="position:absolute;left:8px;top:8px">${lab}</span>`:''}</div><div class="line-tag" style="margin-top:10px;color:${LINES[p.line]}">${p.line}</div><b style="display:block;margin:3px 0">${p.name}</b><div class="muted" style="font-size:12px">${p.v.map(v=>v.size).join(' · ')} · ${p.aroma}</div><div style="display:flex;gap:4px;margin:6px 0;flex-wrap:wrap">${p.cert.slice(0,2).map(c=>`<span class="badge" style="font-size:10px">${c}</span>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="price">${p.v.length>1?'Desde ':''}${clp(minp)}</span><span class="btn btn-sm btn-o">Ver producto</span></div></a>`}
function vals(key){const s=new Set();pub().forEach(p=>{if(key==='size')p.v.forEach(v=>s.add(v.size));else if(key==='cert')p.cert.forEach(c=>s.add(c));else s.add(p[key])});return [...s]}
function count(key,val){return pub().filter(p=>key==='size'?p.v.some(v=>v.size===val):key==='cert'?p.cert.includes(val):p[key]===val).length}
function applyF(){let r=pub().filter(p=>{
 if(F.q&&!(p.name+' '+p.line+' '+p.type+' '+p.aroma).toLowerCase().includes(F.q.toLowerCase()))return false;
 if(F.line.length&&!F.line.includes(p.line))return false; if(F.type.length&&!F.type.includes(p.type))return false;
 if(F.aroma.length&&!F.aroma.includes(p.aroma))return false; if(F.cert.length&&!F.cert.every(c=>p.cert.includes(c)))return false;
 let vs=p.v; if(F.size.length)vs=vs.filter(v=>F.size.includes(v.size)); if(F.avail)vs=vs.filter(v=>v.stock>0);
 if(F.min!=='')vs=vs.filter(v=>v.price>=+F.min); if(F.max!=='')vs=vs.filter(v=>v.price<=+F.max);
 return vs.length>0});
 if(F.sort==='asc')r.sort((a,b)=>Math.min(...a.v.map(v=>v.price))-Math.min(...b.v.map(v=>v.price)));
 if(F.sort==='desc')r.sort((a,b)=>Math.min(...b.v.map(v=>v.price))-Math.min(...a.v.map(v=>v.price)));
 if(F.sort==='az')r.sort((a,b)=>a.name.localeCompare(b.name));
 return r}
function fgroup(key,label){if(!FVIS[key])return '';return `<div class="lbl" style="margin-top:14px">${label}</div>`+vals(key).map(v=>`<div class="chk" data-f="${key}" data-v="${v}" id="f-${key}-${v.replace(/\W/g,'')}"><span class="box ${F[key].includes(v)?'on':''}">${F[key].includes(v)?'✓':''}</span>${v} (${count(key,v)})</div>`).join('')}
function viewCatalog(){
 const r=applyF();const act=[...F.line,...F.type,...F.size,...F.aroma,...F.cert].concat(F.avail?['Solo disponibles']:[]).concat(F.min||F.max?[`Precio ${F.min||0}–${F.max||'∞'}`]:[]).concat(F.q?[`“${F.q}”`]:[]);
 return header('Catálogo')+`<div style="padding:16px 40px 0" class="muted pad">Inicio › <b style="color:var(--texto)">Catálogo</b></div>

 ${FVIS.price?`<div class="lbl" style="margin-top:14px">Precio (CLP)</div><div style="display:flex;gap:6px"><input class="inp" id="pmin" placeholder="Desde" value="${F.min}" type="number"><input class="inp" id="pmax" placeholder="Hasta" value="${F.max}" type="number"></div>`:''}
 ${fgroup('size','Tamaño / volumen')}${fgroup('aroma','Aroma')}${fgroup('cert','Certificación')}
 ${FVIS.avail?`<div class="lbl" style="margin-top:14px">Disponibilidad</div><div class="chk" id="f-avail"><span class="box ${F.avail?'on':''}">${F.avail?'✓':''}</span>Solo disponibles</div>`:''}
 <div style="margin-top:16px;font-size:12.5px;color:var(--hoja);font-weight:600" class="click" id="clear">Limpiar filtros</div>
 <span class="btn btn-p mobile-only" id="applym" style="margin-top:16px;width:100%;text-align:center">Ver ${r.length} productos</span></aside>
 <div style="flex:1"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">

 <div style="display:flex;gap:8px;align-items:center"><span class="btn btn-o btn-sm mobile-only" id="openf">⚙ Filtrar</span><span class="muted">Ordenar</span><select class="inp" id="sort" style="width:170px"><option value="vend">Más vendidos</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option><option value="az">Nombre A–Z</option></select></div></div>
 ${r.length?`<div class="cards">${r.map(card).join('')}</div>`:`<div class="card" id="empty" style="padding:46px;text-align:center;background:var(--crema)"><div style="font-size:44px">🔍</div><h3 style="color:var(--bosque);margin:10px 0 6px">No encontramos productos con esos filtros</h3><p class="muted" style="margin:0 auto 18px">Prueba quitando algún filtro o revisa todas las líneas de Bioproductos DK.</p><span class="btn btn-p click" id="clear2">Limpiar filtros</span></div><h4 style="margin:22px 0 10px">Productos que podrían interesarte</h4><div class="cards">${pub().slice(0,3).map(card).join('')}</div>`}
 </div></div>`+footer();
}
function bindCatalog(){bindSearch();
 document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{const k=e.dataset.f,v=e.dataset.v;F[k]=F[k].includes(v)?F[k].filter(x=>x!==v):[...F[k],v];render()});
 const av=$('#f-avail');if(av)av.onclick=()=>{F.avail=!F.avail;render()};
 const pm=$('#pmin'),px=$('#pmax');[pm,px].forEach(i=>i&&i.addEventListener('change',()=>{F.min=pm.value;F.max=px.value;render()}));
 const cl=()=>{F={...F,line:[],type:[],size:[],aroma:[],cert:[],avail:false,min:'',max:'',q:''};go('#/catalogo')};
 $('#clear').onclick=cl;const c2=$('#clear2');if(c2)c2.onclick=cl;

 const o=$('#openf');if(o)o.onclick=()=>$('#filters').classList.add('open');

function viewHome(){return header('Inicio')+`<div class="hero" style="display:grid;grid-template-columns:1.1fr 1fr;background:linear-gradient(120deg,var(--salvia),var(--crema));padding:46px 40px 40px;gap:30px"><div><span class="badge">Empresa de Base Científico-Tecnológica</span><h1 style="font-size:38px;line-height:1.15;color:var(--bosque);margin:14px 0 12px">Transformamos residuos orgánicos en productos que cuidan tu hogar y el planeta</h1><p class="muted" style="font-size:15px;line-height:1.55">Detergentes concentrados y cuidado personal desarrollados con biotecnología y nanotecnología verde.</p><div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-c" href="#/catalogo" id="cta">Ver catálogo</a><a class="btn btn-o" href="#lineas" onclick="document.getElementById('lineas').scrollIntoView();return false">Conocer las líneas</a></div></div><div class="ph" style="height:260px">${bottle('#4E8B3F','',false)}<div class="cap">Fotografía real de laboratorio / equipo</div></div></div>

let SEL={};
function viewProduct(id){const p=DB.find(x=>x.id===id);if(!p||p.status!=='Activo')return header('Catálogo')+`<div style="padding:60px;text-align:center"><h2>Producto no disponible</h2><p class="muted">El producto no existe o no está publicado.</p><a class="btn btn-p" href="#/catalogo" style="margin-top:14px">Volver al catálogo</a></div>`;
 const i=SEL[id]??p.v.findIndex(v=>v.stock>0);const vi=i<0?0:i;const v=p.v[vi];const out=v.stock===0;const others=p.v.filter(x=>x!==v&&x.stock>0);

 <div class="prodgrid"><div><div class="ph" style="height:380px;position:relative;${out?'opacity:.75':''}">${bottle(p.color,p.k,true)}${out?'<span class="badge g" style="position:absolute;left:14px;top:14px;font-size:13px">Agotado</span>':''}<div class="cap">Fotografía real del producto</div></div></div>
 <div><div class="line-tag" style="color:${LINES[p.line]}">${p.line} · ${p.type}</div><h1 style="font-size:28px;color:var(--bosque);margin:6px 0">${p.name}</h1><div class="muted" style="font-size:12.5px" id="sku">SKU ${v.sku}</div>
 <div class="price" style="font-size:28px;margin:14px 0 4px" id="pprice">${clp(v.price)} <span class="muted" style="font-size:13px;font-weight:400">IVA incluido</span></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0">${p.cert.map(c=>`<span class="badge">${c}</span>`).join('')}</div>

 <div id="avail" style="margin-top:16px">${out?`<div class="card" style="padding:14px 16px;background:#FFF6F5;border-color:#F0C9C3"><b style="color:var(--alerta)">● Agotado</b> <span class="muted">· la variante de ${v.size} no tiene unidades disponibles por ahora.</span>${others.length?`<div class="muted" style="font-size:12px;margin-top:4px">Disponible en: ${others.map(o=>o.size).join(', ')}.</div>`:''}</div>`:`<span style="color:var(--ok);font-weight:700">● Disponible</span> <span class="muted">· ${v.stock<=5?`quedan ${v.stock} unidades`:'en stock'}</span>`}</div>
 <span class="btn btn-g" style="display:block;text-align:center;margin-top:16px;color:#7d8a83">Compra en línea disponible en una próxima versión</span>
 ${p.perf?`<div class="card" style="margin-top:16px;padding:14px;background:var(--crema)"><b class="mont" style="color:var(--bosque)">Rendimiento</b><div class="muted" style="margin-top:6px">${p.perf}</div></div>`:''}
 <p style="margin-top:14px;line-height:1.55" class="muted">${p.desc}</p><a class="btn btn-o btn-sm" href="#/catalogo" style="margin-top:10px">‹ Volver al catálogo</a></div></div>`+footer()}
function bindProduct(id){bindSearch();document.querySelectorAll('.vsel').forEach(e=>e.onclick=()=>{SEL[id]=+e.dataset.j;render()})}
function viewContact(){return header('Contacto')+`<div style="padding:50px 40px" class="pad"><h2 style="color:var(--bosque)">Contacto</h2><p class="muted" style="margin-top:8px">biocontacto@bioproductosdk.com · WhatsApp +56 9 7977 1179 · Huérfanos 1160, Of. 1102, Santiago.</p><p class="muted" style="margin-top:8px">El formulario de contacto B2B queda en el Product Backlog.</p></div>`+footer()}
// ---------- admin ----------
function aTop(){return `<div class="top2"><span class="mont" style="font-weight:700">Bioproductos DK · Administración</span><span><a href="#/inicio" style="text-decoration:underline">Ver tienda ↗</a> &nbsp; <a id="logout" class="click">Cerrar sesión</a></span></div>`}
function aside(on){const it=[["🧴 Productos","#/admin/productos"],["🧩 Búsqueda y filtros","#/admin/filtros"]];return `<div class="aside">${it.map(i=>`<a href="${i[1]}" class="${i[0].includes(on)?'on':''}">${i[0]}</a>`).join('')}</div>`}
function viewLogin(){return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F4F3;padding:16px"><div class="card" style="width:420px;max-width:100%;padding:30px"><div class="logo" style="font-size:16px;margin-bottom:14px"><div class="leaf" style="width:28px;height:28px"></div>Bioproductos DK · Administración</div><h2 style="color:var(--bosque)">Iniciar sesión</h2><p class="muted" style="margin:4px 0 16px">Solo personal autorizado · usa cualquier correo de prueba y un código de 6 dígitos</p>
 <label>Correo electrónico</label><input class="inp" id="em" placeholder="nombre@bioproductosdk.com" style="margin-bottom:4px"><div class="errtxt" id="e1"></div>
 <label style="margin-top:8px">Contraseña</label><input class="inp" id="pw" type="password" placeholder="••••••••" style="margin-bottom:4px"><div class="errtxt" id="e2"></div>
 <label style="margin-top:8px">Código de verificación en dos pasos</label><input class="inp" id="otp" maxlength="6" placeholder="6 dígitos"><div class="errtxt" id="e3"></div>
 <span class="btn btn-d click" id="login" style="display:block;text-align:center;margin-top:16px">Ingresar</span><a href="#/inicio" class="muted" style="display:block;text-align:center;margin-top:12px;font-size:12.5px">‹ Volver a la tienda</a></div></div>`}
function bindLogin(){$('#login').onclick=()=>{const em=$('#em').value.trim(),pw=$('#pw').value,ot=$('#otp').value.trim();let ok=true;
 $('#e1').textContent=/^\S+@\S+\.\S+$/.test(em)?'':(ok=false,'⚠ Ingresa un correo válido');$('#e2').textContent=pw.length>=6?'':(ok=false,'⚠ La contraseña debe tener al menos 6 caracteres');$('#e3').textContent=/^\d{6}$/.test(ot)?'':(ok=false,'⚠ El código debe tener 6 dígitos');
 if(ok){ADMIN=true;toast('Sesión iniciada');go('#/admin/productos')}}}
function viewAList(){const rows=DB.filter(p=>TAB==='Todos'||p.status===TAB.slice(0,-1)||(TAB==='Activos'&&p.status==='Activo'));
 return aTop()+`<div class="adm" style="display:flex">${aside('Productos')}<div class="amain"><div class="atop"><h2>Productos</h2><a class="btn btn-d btn-sm" href="#/admin/producto/nuevo">+ Agregar producto</a></div>
 <div class="card" style="padding:0;overflow:auto"><div class="tabs">${["Todos","Activos","Borradores"].map(t=>`<span class="${t===TAB?'on':''} tab" data-t="${t}">${t} (${t==='Todos'?DB.length:DB.filter(p=>p.status===(t==='Activos'?'Activo':'Borrador')).length})</span>`).join('')}</div>
 <table><tr><th></th><th>Producto</th><th>Estado</th><th>Inventario</th><th>Tipo</th><th>Línea</th></tr>${DB.filter(p=>TAB==='Todos'||p.status===(TAB==='Activos'?'Activo':'Borrador')).map(p=>`<tr class="rowlink" data-id="${p.id}"><td><div class="thumb">${bottle(p.color,p.k)}</div></td><td><b>${p.name}</b></td><td><span class="tag ${p.status==='Activo'?'a':'b'}">${p.status}</span></td><td style="${p.v.some(v=>v.stock===0)?'color:var(--alerta)':''}">${p.v.map(v=>`${v.stock} (${v.size})`).join(' · ')}</td><td>${p.type}</td><td>${p.line}</td></tr>`).join('')}</table></div>
 <div class="muted" style="font-size:12px;margin-top:10px">Haz clic en un producto para editarlo. Solo los productos <b>Activos</b> aparecen en el catálogo público.</div></div></div>`}
function bindAList(){document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{TAB=e.dataset.t;render()});document.querySelectorAll('.rowlink').forEach(e=>e.onclick=()=>go('#/admin/producto/'+e.dataset.id));const l=$('#logout');if(l)l.onclick=()=>{ADMIN=false;go('#/admin')}}
function viewAForm(id){const isNew=id==='nuevo';const p=isNew?{id:'',name:'',line:'Bioproductos DK',type:'Detergentes',aroma:'',color:'#4E8B3F',k:'',cert:[],perf:'',status:'Borrador',desc:'',v:[{size:'1 L',sku:'',price:0,stock:0}]}:DB.find(x=>x.id===id);
 const CERTS=["Biodegradable","Libre de testeo animal","Hipoalergénico","Antibacterial"];
 return aTop()+`<div class="adm" style="display:flex">${aside('Productos')}<div class="amain"><div class="atop"><div><a class="muted" href="#/admin/productos" style="font-size:12.5px">‹ Productos</a><h2>${isNew?'Nuevo producto':p.name}</h2></div><div style="display:flex;gap:8px"><a class="btn btn-g" href="#/admin/productos">Descartar</a><span class="btn btn-d click" id="save">Guardar</span></div></div>
 <div class="grid" style="grid-template-columns:1.65fr 1fr"><div><div class="kpi"><label>Título <span class="req">*</span></label><input class="inp" id="t" value="${p.name}"><div class="errtxt" id="et"></div>
 <label style="margin-top:10px">Descripción</label><input class="inp" id="d" value="${p.desc}"><label style="margin-top:10px">Aroma</label><input class="inp" id="ar" value="${p.aroma}"></div>
 <div class="kpi" style="margin-top:12px"><b class="mont">Variantes</b><table style="margin-top:8px"><tr><th>Tamaño</th><th>SKU</th><th>Precio (CLP)</th><th>Disponible</th></tr>${p.v.map((v,j)=>`<tr><td><input class="inp vs" data-j="${j}" value="${v.size}" style="padding:5px 8px"></td><td><input class="inp vk" data-j="${j}" value="${v.sku}" style="padding:5px 8px"></td><td><input class="inp vp" data-j="${j}" type="number" value="${v.price}" style="padding:5px 8px"><div class="errtxt" id="ep${j}"></div></td><td><input class="inp vq" data-j="${j}" type="number" value="${v.stock}" style="padding:5px 8px"><div class="errtxt" id="eq${j}"></div></td></tr>`).join('')}</table></div>
 <div class="kpi" style="margin-top:12px"><b class="mont">Metacampos: certificaciones</b>${CERTS.map(c=>`<div class="chk click cchk" data-c="${c}"><span class="box ${p.cert.includes(c)?'on':''}">${p.cert.includes(c)?'✓':''}</span>${c}</div>`).join('')}</div></div>
 <div><div class="kpi"><b class="mont">Estado</b><select class="inp" id="st" style="margin-top:8px"><option ${p.status==='Activo'?'selected':''}>Activo</option><option ${p.status==='Borrador'?'selected':''}>Borrador</option></select><div class="help">Activo = visible en el catálogo · Borrador = oculto</div></div>
 <div class="kpi" style="margin-top:12px"><b class="mont">Organización</b><label style="margin-top:8px">Línea de marca</label><select class="inp" id="ln">${Object.keys(LINES).map(l=>`<option ${l===p.line?'selected':''}>${l}</option>`).join('')}</select><label style="margin-top:8px">Tipo de producto</label><select class="inp" id="ty">${["Detergentes","Champús sólidos","Sales","Limpiadores"].map(l=>`<option ${l===p.type?'selected':''}>${l}</option>`).join('')}</select></div></div></div></div></div>`}
let CERTSEL=null;
function bindAForm(id){const isNew=id==='nuevo';document.querySelectorAll('.amain input').forEach(i=>i.addEventListener('input',()=>{const e=i.parentElement.querySelector('.errtxt');if(e)e.textContent=''}));const p=isNew?null:DB.find(x=>x.id===id);CERTSEL=new Set(p?p.cert:[]);
 document.querySelectorAll('.cchk').forEach(e=>e.onclick=()=>{const c=e.dataset.c;CERTSEL.has(c)?CERTSEL.delete(c):CERTSEL.add(c);const b=e.querySelector('.box');b.classList.toggle('on');b.textContent=CERTSEL.has(c)?'✓':''});
 $('#save').onclick=()=>{let ok=true;const t=$('#t').value.trim();$('#et').textContent=t?'':(ok=false,'⚠ El título es obligatorio');
  const vs=[...document.querySelectorAll('.vp')].map((e,j)=>{const pr=+e.value,q=+document.querySelector(`.vq[data-j="${j}"]`).value;document.getElementById('ep'+j).textContent=pr>0?'':(ok=false,'El precio debe ser mayor a 0');document.getElementById('eq'+j).textContent=q>=0&&Number.isInteger(q)?'':(ok=false,'Cantidad entera ≥ 0');return {size:document.querySelector(`.vs[data-j="${j}"]`).value,sku:document.querySelector(`.vk[data-j="${j}"]`).value,price:pr,stock:q}});
  if(!ok){toast('Revisa los campos marcados');return}
  const data={name:t,desc:$('#d').value,aroma:$('#ar').value||'Neutro',status:$('#st').value,line:$('#ln').value,type:$('#ty').value,cert:[...CERTSEL],v:vs};
  if(isNew){DB.push({id:'nuevo-'+Date.now(),color:'#8DBF6A',k:'',perf:'',...data})}else Object.assign(p,data);
  toast(data.status==='Activo'?'Producto guardado y publicado en el catálogo':'Producto guardado como borrador (oculto)');go('#/admin/productos')};
 const l=$('#logout');if(l)l.onclick=()=>{ADMIN=false;go('#/admin')}}
function viewAFilters(){return aTop()+`<div class="adm" style="display:flex">${aside('Búsqueda')}<div class="amain"><div class="atop"><div><div class="muted" style="font-size:12.5px">Apps › Search &amp; Discovery ›</div><h2>Filtros del catálogo</h2></div></div>
 <div class="card" style="padding:0"><table><tr><th>Filtro</th><th>Origen del dato</th><th>Visible</th></tr>${FILTERS_DEF.map(f=>`<tr><td><b>${f[1]}</b></td><td>${{avail:'Inventario',price:'Precio de variante',line:'Proveedor',type:'Tipo de producto',size:'Opción de variante',aroma:'Opción de variante',cert:'Metacampo'}[f[0]]}</td><td><span class="sw ${FVIS[f[0]]?'':'off'}" data-k="${f[0]}"><i></i></span></td></tr>`).join('')}</table></div>
 <div class="muted" style="font-size:12px;margin-top:10px">Activa o desactiva un filtro y revisa el cambio en <a href="#/catalogo" style="text-decoration:underline">el catálogo</a>.</div></div></div>`}
function bindAFilters(){document.querySelectorAll('.sw').forEach(e=>e.onclick=()=>{FVIS[e.dataset.k]=FVIS[e.dataset.k]?0:1;toast('Filtro '+(FVIS[e.dataset.k]?'activado':'desactivado'));render()});const l=$('#logout');if(l)l.onclick=()=>{ADMIN=false;go('#/admin')}}
function parseQ(h){const i=h.indexOf('?');const q={};if(i>=0)h.slice(i+1).split('&').forEach(kv=>{const [k,v]=kv.split('=');q[k]=decodeURIComponent(v||'')});return q}
function render(){const h=decodeURIComponent(location.hash||'#/inicio');const path=h.split('?')[0];const q=parseQ(h);const app=$('#app');window.scrollTo(0,0);
 if(path==='#/catalogo'){if(q.line){F.line=[q.line];history.replaceState(null,'','#/catalogo')}if(q.q!==undefined){F.q=q.q;history.replaceState(null,'','#/catalogo')}app.innerHTML=viewCatalog();bindCatalog();return}
 if(path.startsWith('#/producto/')){const id=path.split('/')[2];app.innerHTML=viewProduct(id);bindProduct(id);return}
 if(path==='#/contacto'){app.innerHTML=viewContact();bindSearch();return}
 if(path.startsWith('#/admin')){if(!ADMIN){app.innerHTML=viewLogin();bindLogin();return}
  if(path==='#/admin/filtros'){app.innerHTML=viewAFilters();bindAFilters();return}
  if(path.startsWith('#/admin/producto/')){const id=path.split('/')[3];app.innerHTML=viewAForm(id);bindAForm(id);return}
  app.innerHTML=viewAList();bindAList();return}
 app.innerHTML=viewHome();bindSearch()}
window.addEventListener('hashchange',render);render();
</script>
</body></html>
